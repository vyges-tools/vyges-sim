name: release

# Build the pinned vyges-sim image (Verilator + cocotb) and publish it to ghcr.io
# as a MULTI-ARCH manifest: linux/amd64 + linux/arm64.
#
# Pure apt + pip (no source compile), so a single buildx multi-platform build with
# QEMU is fast and simplest — no native-runner matrix needed. MANUAL by design
# (only changes on an Ubuntu rebase); sync-check opens a reminder issue.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Vyges date-release (the Ubuntu LTS, e.g. 26.04; add -N for intra-LTS rebuilds)"
        required: true
        default: "26.04"

permissions:
  packages: write   # push to ghcr.io

env:
  IMG: ghcr.io/vyges-tools/vyges-sim

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch (amd64 + arm64)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VYGES_SIM_VERSION="$VERSION" \
            -t "$IMG:$VERSION" -t "$IMG:latest" --push .

      - name: Validate BOTH arches (tools present + descriptor)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for PLAT in linux/amd64 linux/arm64; do
            echo "== validating $PLAT =="
            docker run --rm --platform "$PLAT" "$IMG:$VERSION" bash -c '
              set -e
              echo "arch: $(uname -m)"
              verilator --version
              python3 -c "import cocotb; print(\"cocotb\", cocotb.__version__)"
              test -f /opt/vyges/vyges-tool.json && echo "descriptor OK"'
          done

      - name: Show manifest
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "$IMG:$VERSION"
